[project]
name = "gold-hsitorydata-p"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdo Elasyed", email = "said01119@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-postgres>=1.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "pytrends>=4.9.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
gold-hsitorydata-p = "gold_hsitorydata_p:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pgcli>=4.5.0",
]
